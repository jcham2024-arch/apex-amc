name: verify

# Every gate in package.json's `verify` script, run on a clean runner.
#
# Before this existed, every gate ran only when a human remembered. That
# makes every dependency bump and every version experiment a manual risk - which
# is exactly the situation `docs/REVIEW.md` P0-3 flagged.
#
# This workflow is the thing that makes Dependabot safe: an upgrade PR cannot
# merge unless this is green.

on:
  # Any branch, not just main. A branch that has never seen CI cannot be trusted
  # to merge; restricting to main means every feature branch ships unproven and
  # the first real CI run happens after the code has already landed.
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A new push to the same branch supersedes an in-flight run. Without this, a
# burst of pushes queues every run and the badge lags reality by an hour.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, typecheck, test, and every gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # v5, not v4. The v4 line targets Node 20, which GitHub has deprecated on
      # runners; v4 runs only because it is force-migrated to Node 24, and that
      # override is announced as temporary. Dependabot watches github-actions, so
      # this will be nudged forward again if v6 appears.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Matches "engines" in package.json. Node 22.6 is the floor because
          # scripts/gates/check-seeds.mjs uses node:sqlite.
          node-version: '22'
          cache: 'npm'

      # `npm ci`, not `npm install`: it installs from the lockfile and fails if
      # package.json and the lockfile disagree. `npm install` would silently
      # resolve a different tree and hide exactly the drift CI exists to catch.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Covers packages/ballistics-core AND apps/ballistics. The Expo app had a
      # broken tsconfig that matched zero files until 1 Oct 2026, so nothing in
      # it was typechecked before that.
      - name: Typecheck
        run: npm run typecheck:all

      - name: Unit tests
        run: npm run test:all

      # The self-containment gate passes trivially when dist/ is absent ("not
      # built"), so the site must be built first or the check is vacuous.
      #
      # `website:build` runs `website:csp` afterwards, which writes the SHA-256
      # of each inline block into dist/_headers. Those hashes are a property of
      # the emitted bytes, not of the source, so they cannot be committed - they
      # have to be regenerated on every machine that builds. The gate then
      # verifies they match, which is what turns a stale hash into a build
      # failure rather than a silently blank page.
      - name: Build the website
        run: npm run website:build

      # Everything else: encoding, bullets, schema, seeds, data drift, docs,
      # handoff integrity, security findings, modules, website self-containment,
      # compliance claims, task write-set collisions, and the physics oracle.
      #
      # These must stay in step with `npm run verify`. A gate that runs locally
      # but not in CI is a gate nobody relies on: a pull request that breaks the
      # oracle would merge green. The `ci:check` step below fails if this list
      # and package.json ever diverge.
      - name: Remaining gates
        run: |
          npm run test:encoding
          npm run test:bullets
          npm run schema:check
          npm run seed:check
          npm run data:validate
          npm run docs:check
          npm run handoff:status
          npm run security:check
          npm run modules:check
          npm run website:check
          npm run claims:check
          npm run tasks:check
          npm run tasking:check
          npm run mail:check
          npm run roles:check
          npm run proposals:check
          npm run oracle:check
          npm run regulations:check

      # This workflow lists gates by hand, which is how three of them went
      # missing (claims, tasks, oracle). This compares the list against
      # package.json and fails if any gate in `verify` is absent here, so the
      # drift is caught rather than discovered after something merges.
      - name: CI covers every gate in verify
        run: npm run ci:check

      # Kept as its own step so a vulnerability fails loudly and is attributed
      # to the audit rather than to whichever gate ran last.
      #
      # NOT `npm audit --audit-level=high` directly. That command has never
      # passed here and cannot: node-forge 1.4.0 is the newest published version
      # and the advisory lists no patched version at all. A permanently red step
      # teaches everyone to ignore the exit code, including the day a genuinely
      # new advisory appears.
      #
      # audit-advisories.mjs runs the same audit, fails on any NEW high or critical
      # advisory, and reports known ones in full with their recorded reason. It
      # rejects an acknowledgement carrying no reason, so it cannot become the
      # place where findings go to be forgotten.
      - name: Audit production dependencies
        run: node scripts/security/audit-advisories.mjs

      # Prove the page satisfies its own CSP, in a real browser.
      #
      # Everything else in this workflow is static analysis, and on 1 Oct 2026 that
      # passed a policy which blocked the entire site: `script-src` carried a
      # literal `nonce-{RANDOM}` that Chrome discards as an invalid source. The
      # header did contain a CSP directive and no `unsafe-*` keyword, so every
      # existing check was satisfied by a configuration that rendered nothing.
      #
      # This is the only step that observes what the browser actually does rather
      # than what the file claims. It serves the built dist/ under its own
      # dist/_headers, loads it in headless Chrome, and fails if the inline script
      # does not execute or any CSP violation reaches the console.
      #
      # It asserts on #retailerGrid gaining rendered children, NOT on page text:
      # the earlier version searched for a string that was already in the static
      # markup, so it passed against a policy that blocked the entire site.
      #
      # `browser-actions/setup-chrome` is required, not decoration. The check
      # calls process.exit(2) when it cannot find a browser, and it was relying
      # on the runner image happening to ship one. That is an accident, not a
      # guarantee: a runner image refresh, a self-hosted runner, or the
      # ubuntu-latest -> Ubuntu 26 migration (19 Oct 2026) can all remove it, and
      # the symptom is a red build whose log says "SKIPPED: no Chrome found" on a
      # commit that changed nothing about the browser. Declaring the dependency
      # makes the step self-sufficient instead of accidentally satisfied.
      - name: Install Chrome for the CSP check
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: false

      - name: CSP is enforced in a real browser
        run: npm run website:csp:browser

      - name: Confirm the build is reproducible
        # Rebuilds from scratch and diffs the SHA-256. A non-deterministic build
        # would make the checksummed handoff manifest meaningless, because a
        # rebuilt artefact would not match the approved one.
        run: |
          sha256sum apps/website/dist/index.html
          rm -rf apps/website/dist
          npm run website:build
          sha256sum apps/website/dist/index.html