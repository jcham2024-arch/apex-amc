# Column manifest: cartridge_pressures
#
# The primary pressure compilation, keyed on cartridge name as the publisher
# spells it. This is a COMPILATION, not primary data: the figures are maxima
# collected from SAAMI and CIP member tables by a third party, which is why
# every row's source_kind is 'compilation' and why a curated cartridge_specs
# figure outranks it (see cartridge_specs.yaml).
#
# The key here is cartridge_NAME, not the cartridge_specs slug, so names that
# disagree between sources are a known and separate problem - see
# cartridge_pressure_conflicts.yaml, which records the disagreements explicitly
# rather than papering over them.

dataset: cartridge_pressures
storage: csv
csv_path: data/seeds/cartridge_pressures.csv
# The CSV columns are WIDE, not long: `saami_piezo_ksi` and `cip_piezo_ksi` are
# separate columns on the same row. So one cartridge gets exactly one row, and
# the two standards bodies are recorded side by side rather than as two rows.
#
# Three cartridges arrived twice as separate rows, which `npm run data:health`
# reported as duplicate primary keys. None of them was a real disagreement:
#
#   6.5x70R  row 57 carried cip_piezo_ksi=41 AND cip_cup=36
#            row 69 carried cip_piezo_ksi=41 only  -> a lossy partial re-entry
#   9.3x72R  row 171 carried cip_piezo_ksi=29 AND cip_cup=26
#            row 175 carried cip_piezo_ksi=29 only  -> a lossy partial re-entry
#   .300 WSM row 107 carried cip_piezo_ksi=65
#            row 112 carried saami_piezo_ksi=64      -> two DIFFERENT standards
#
# The first two were the earlier, more complete rows and have been kept
# verbatim. Keeping the later row instead would have deleted a real datapoint
# (the c.u.p. figure).
#
# `.300 WSM` is the one that needed judgement rather than a discard: CIP says 65
# ksi, SAAMI says 64 ksi. Both are true and they are not interchangeable - CIP
# and SAAMI are different bodies with different methods. That is not a
# transcription error, so it belongs in one row with both columns filled, not in
# cartridge_pressure_conflicts.yaml, which compares compilations against each
# other rather than two standards bodies against each other.
#
# Merged to: saami_piezo_ksi=64, cip_piezo_ksi=65.
primary_key: [cartridge_name]

columns:
  cartridge_name:
    type: string
    required: true
    note: >
      Cartridge designation exactly as the compiler prints it. Joined to
      cartridge_specs.slug via the loader's name index, so a spelling change
      orphans the row rather than silently creating a new cartridge.

  saami_piezo_ksi:
    type: number
    required: false
    note: SAAMI maximum piezo pressure, ksi. Blank where the cartridge is not SAAMI-listed.

  cip_piezo_ksi:
    type: number
    required: false
    note: CIP maximum piezo pressure, ksi. Blank where not CIP-listed.

  saami_cup:
    type: number
    required: false
    note: SAAMI maximum pressure in cup of copper (c.u.p.). Blank where not SAAMI-listed.

  cip_cup:
    type: number
    required: false
    note: CIP maximum pressure in cup. Blank where not CIP-listed.

  other:
    type: string
    required: false
    note: >
      Free-text non-tabletted value for a handful of cartridges, e.g. a European
      proof figure in bar. Kept as text rather than parsed, because the units
      and standards are not consistent enough to coerce.

  footnote:
    type: string
    required: false
    note: Marker for a note in the publisher's own table. May contain commas; keep quoted.

  unit_note:
    type: string
    required: false
    note: >
      Where the source's unit differs from the column's stated unit. The ksi
      columns in particular were rounded up by the compiler, so a row carrying
      a unit_note must not be read as a precise figure.