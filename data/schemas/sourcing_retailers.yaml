# Column manifest: sourcing_retailers
#
# Where components can actually be bought. Keyed on manufacturer_slug, because a
# retailer that stocks Berger bullets is not the same entity as Berger and the
# project treats them as separate records.
#
# The nullable columns are the honest part. affiliate_network, feed_format and
# scraping_status are unknown for every retailer today, and they are left NULL
# rather than filled with plausible defaults - the notes column says why per
# retailer. A sourcing table whose blanks are guesses produces affiliate links
# that silently do not work.

dataset: sourcing_retailers
storage: csv
csv_path: data/seeds/sourcing_retailers.csv
primary_key: [manufacturer_slug]
references:
  - column: manufacturer_slug
    dataset: manufacturers
    target_column: slug

columns:
  manufacturer_slug:
    type: string
    required: true
    pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    note: >
      The stocking retailer's own slug in manufacturers.csv. Named
      manufacturer_slug rather than slug because this file describes a retailer
      viewed as a supplier, and 013_sourcing.sql exposes it to listings as
      retailer_slug via m.slug. A column alias in SQL does not make it a
      different key, so this is the one a cross-dataset reference must target.

  source_type:
    type: string
    required: true
    enum: [online, local_store, dealer]
    note: >
      How the retailer sells. 'online' is a website; 'dealer' is a distributor
      or wholesaler rather than a shop a consumer visits.

  ships_domestically:
    type: boolean
    required: false
    note: Whether it ships within its own country.

  ships_to_regions:
    type: string
    required: false
    note: >
      Comma-separated region codes it ships to, e.g. "US, CA, UK, EU". Free text
      rather than an enum because region boundaries differ between retailers and
      a retailer may ship to a country with no region code.

  hazmat_shipping:
    type: boolean
    required: false
    note: >
      Whether it ships flammable reloading components. Practically all do, but
      it is recorded because it is a real constraint on where a user can buy
      powder, and it is the kind of fact that should come from the retailer
      rather than be assumed.

  directions:
    type: string
    required: false
    note: Street address, for a physical store.

  city:
    type: string
    required: false
    note: City, for a physical store.

  region_code:
    type: string
    required: false
    note: State or province code, for a physical store.

  affiliate_network:
    type: string
    required: false
    note: >
      Which affiliate programme the retailer belongs to. NULL for every retailer
      today - the project README names AvantLink but also warns that several
      programmes have since migrated, and an unconfirmed network that is filled
      in anyway produces dead links.

  network_store_id:
    type: string
    required: false
    note: The retailer's id within the affiliate network. Blank while affiliate_network is.

  link_template:
    type: string
    required: false
    format: url
    note: >
      Search URL with a {search} placeholder, e.g.
      https://www.midwayusa.com/search/?q={search}. Almost always the site's own
      search form, because per-SKU deep links have not been captured. A URL with
      no {search} is a defect: it would send every query to one page.

  feed_format:
    type: string
    required: false
    note: >
      Machine-readable product feed the retailer publishes, if any. NULL for all
      retailers today; recorded so that "no feed" is a known answer rather than
      an unchecked one.

  affiliate_status:
    type: string
    required: false
    enum: [unknown, not_applicable, pending, active, rejected]
    note: >
      State of the affiliate relationship. 'unknown' is an honest starting point,
      not a failure - it says nobody has checked, which is different from
      claiming there is no programme.

  scraping_status:
    type: string
    required: false
    enum: [unknown, blocked, allowed, not_attempted]
    note: >
      Whether this retailer's terms permit automated product lookup. Always
      'unknown' today and deliberately so: 'allowed' must never be assumed, and
      the answer decides whether the component finder may query it at all.

  notes:
    type: string
    required: false
    note: >
      Free prose, and the place where the reasoning behind a blank lives. May
      contain commas; keep quoted.